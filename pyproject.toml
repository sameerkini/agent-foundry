[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "agent-foundry-local"
version = "0.1.0"
description = "An inspectable, provider-neutral agent harness with bounded tools and explicit memory"
requires-python = ">=3.11"
dependencies = ["openai>=1.65,<3", "pydantic>=2.10,<3", "jsonschema>=4.23,<5", "python-dotenv>=1.0,<2", "mcp>=2,<3"]

[project.scripts]
foundry = "agent_foundry.cli:main"

[dependency-groups]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=0.25,<2"]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_foundry"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
